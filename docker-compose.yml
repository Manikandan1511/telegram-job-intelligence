services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_intelligence
      POSTGRES_USER: job_intelligence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_intelligence -d job_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://job_intelligence:${POSTGRES_PASSWORD:-local_dev_only_change_me}@database:5432/job_intelligence
      TELEGRAM_SESSION: /app/storage/telegram
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./backend/data:/app/backend/data
    depends_on:
      database:
        condition: service_healthy
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
volumes:
  postgres_data:
