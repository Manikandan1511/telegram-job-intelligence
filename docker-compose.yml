services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # Reuse the user's existing SQLite database, Telegram session, and resume files.
      DATABASE_URL: sqlite:///./backend/data/job_intelligence.db
      TELEGRAM_SESSION: /app/storage/telegram
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./backend/data:/app/backend/data
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
